<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccam</title>
<style>
  :root {
    color-scheme: dark;
    --ground:#0F1216; --raised:#171B21; --raised-2:#1E242D; --sunken:#0B0E12; --line:#262C34;
    --ink:#E7EBF0; --muted:#9AA4B2; --faint:#626D7C;
    --primary:#6E8BFF; --primary-ink:#0B0E12;
    --ok:#46C08A; --warn:#E0A83E; --crit:#E05C53;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink);
         font-family:var(--font); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1000px; margin:0 auto; padding:36px 28px 90px; }
  a { color:inherit; }
  code, .mono { font-family:var(--mono); }

  .top { display:flex; align-items:baseline; gap:32px; border-bottom:1px solid var(--line); }
  .brand { font-size:22px; font-weight:700; letter-spacing:-.03em; padding-bottom:16px; }
  nav { display:flex; gap:26px; }
  nav button { background:none; border:none; font:inherit; font-size:15px; color:var(--muted);
    padding:0 0 16px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  nav button[aria-current="true"] { color:var(--ink); font-weight:600; border-bottom-color:var(--primary); }
  .signout { margin-left:auto; padding-bottom:16px; }

  .head { display:flex; align-items:flex-end; margin-top:32px; gap:14px; }
  h1 { margin:0; font-size:24px; font-weight:680; letter-spacing:-.02em; }
  .sub { margin-top:5px; font-size:14px; color:var(--muted); }
  .head .grow { margin-left:auto; }

  table { width:100%; border-collapse:collapse; margin-top:24px; }
  th { text-align:left; padding:0 0 12px; font-size:13px; font-weight:500; color:var(--faint); }
  td { padding:18px 0; border-top:1px solid var(--line); font-size:15px; vertical-align:middle; }
  td.right, th.right { text-align:right; }
  .name { font-weight:560; font-size:15.5px; }
  .under { margin-top:3px; font-size:13px; color:var(--faint); }
  .free { color:var(--faint); }

  .pill { display:inline-flex; align-items:center; gap:7px; font-size:13px;
    border:1px solid var(--line); border-radius:999px; padding:4px 11px 4px 9px; white-space:nowrap; }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--faint); }
  .pill.ready { color:var(--ok); border-color:color-mix(in srgb, var(--ok) 35%, var(--line)); }
  .pill.ready::before { background:var(--ok); }
  .pill.need { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 35%, var(--line)); }
  .pill.need::before { background:var(--warn); }

  .people-tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink);
    background:var(--raised-2); border:1px solid var(--line); border-radius:7px; padding:4px 8px; }
  .tag button { background:none; border:none; color:var(--faint); cursor:pointer; padding:0; font-size:15px; line-height:1; }
  .tag button:hover { color:var(--crit); }

  button.fill, button.ghost, button.danger {
    font:inherit; font-size:14px; border-radius:8px; padding:10px 16px; cursor:pointer; }
  button.fill { background:var(--primary); border:1px solid var(--primary); color:var(--primary-ink); font-weight:600; }
  button.fill:hover { filter:brightness(1.08); }
  button.ghost { background:var(--raised-2); border:1px solid var(--line); color:var(--ink); }
  button.ghost:hover { border-color:#3a4453; }
  button.danger { background:none; border:1px solid color-mix(in srgb, var(--crit) 45%, var(--line)); color:var(--crit); }
  button.link { background:none; border:none; font:inherit; font-size:14px; color:var(--primary); padding:8px 0; cursor:pointer; }
  button.link.warn { color:var(--crit); }
  button.link.plain { color:var(--muted); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }

  label { display:block; font-size:14px; color:var(--muted); margin-bottom:8px; }
  input, select { width:100%; background:var(--sunken); border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:11px 12px; font:inherit; font-size:15px; }
  .field + .field { margin-top:16px; }
  .checks { display:flex; flex-direction:column; gap:2px; max-height:240px; overflow-y:auto;
    border:1px solid var(--line); border-radius:8px; padding:6px; background:var(--sunken); }
  .check { display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:6px;
    font-size:14.5px; color:var(--ink); cursor:pointer; margin:0; }
  .check:hover { background:var(--raised-2); }
  .check input { width:auto; accent-color:var(--primary); }

  .copybox { display:flex; gap:8px; margin-top:6px; }
  .copybox code { flex:1; min-width:0; overflow-x:auto; white-space:nowrap; background:var(--sunken);
    border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-size:13.5px; }
  .copybox button { flex:none; background:var(--primary); color:var(--primary-ink); border:none;
    border-radius:8px; padding:0 15px; font:inherit; font-weight:600; cursor:pointer; }

  dialog { border:1px solid var(--line); border-radius:14px; background:var(--raised); color:var(--ink);
    padding:26px 28px 22px; width:480px; max-width:92vw; }
  dialog::backdrop { background:rgba(6,8,11,.74); }
  dialog h2 { margin:0; font-size:19px; font-weight:660; }
  .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
  .note { margin:16px 0 0; font-size:14px; color:var(--muted); line-height:1.55; }
  .note.warn { color:var(--warn); }

  .gate { max-width:380px; margin:16vh auto; }
  .gate h1 { font-size:26px; }
  .gate p { font-size:15px; color:var(--muted); margin:12px 0 26px; }
  .err { margin-top:14px; font-size:14px; color:var(--crit); min-height:1.2em; }
  .hidden { display:none; }
  .empty { margin-top:26px; padding:34px 28px; border:1px dashed var(--line); border-radius:12px;
    text-align:center; color:var(--muted); font-size:15px; line-height:1.6; }
  .ev { display:flex; gap:18px; padding:15px 0; border-top:1px solid var(--line); font-size:15px; }
  .ev time { color:var(--faint); flex:0 0 130px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<!-- Setting up, or signing in -->
<div class="wrap gate hidden" id="gate">
  <h1 id="gate-title">Sign in</h1>
  <p id="gate-blurb">Sign in to hand out and take back the Claude accounts you share.</p>
  <form id="gate-form">
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
    </div>
    <div class="actions"><button class="fill" type="submit" id="gate-go">Sign in</button></div>
    <div class="err" id="gate-err"></div>
  </form>
</div>

<!-- The main view -->
<div class="wrap hidden" id="panel">
  <div class="top">
    <span class="brand">ccam</span>
    <nav>
      <button data-tab="accounts" aria-current="true">Accounts</button>
      <button data-tab="people">People</button>
      <button data-tab="activity">Activity</button>
    </nav>
    <span class="signout"><button class="link plain" id="signout">Sign out</button></span>
  </div>

  <section id="tab-accounts">
    <div class="head">
      <div><h1>Accounts</h1><div class="sub" id="accounts-sub"></div></div>
      <div class="grow"><button class="ghost" id="add-account">Add an account</button></div>
    </div>
    <div id="accounts-body"></div>
  </section>

  <section id="tab-people" class="hidden">
    <div class="head">
      <div><h1>People</h1><div class="sub" id="people-sub"></div></div>
      <div class="grow"><button class="fill" id="invite-someone">Invite someone</button></div>
    </div>
    <div id="people-body"></div>
  </section>

  <section id="tab-activity" class="hidden">
    <div class="head">
      <div><h1>Activity</h1><div class="sub">Everything that happened to an account</div></div>
    </div>
    <div id="activity-body"></div>
  </section>
</div>

<dialog id="dlg">
  <h2 id="dlg-title"></h2>
  <div id="dlg-body"></div>
  <div class="actions">
    <button class="ghost" id="dlg-cancel">Cancel</button>
    <button class="fill" id="dlg-ok">OK</button>
  </div>
  <div class="err" id="dlg-err"></div>
</dialog>

<script>
const $ = (s, r = document) => r.querySelector(s);
const el = (t, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(t), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

async function api(method, path, body) {
  // Relative to the document, so the same UI works served directly by the panel
  // (document at "/") and behind a machine's local reverse proxy (document at
  // "/panel/"), where it is embedded in the ccam page.
  const res = await fetch(path.replace(/^\//, ""), {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || `That did not work (${res.status}).`);
  return data;
}

// --- when things happen, in words ------------------------------------------
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const mins = Math.round((now - d) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} ${hrs === 1 ? "hour" : "hours"} ago`;
  const days = Math.round(hrs / 24);
  if (days < 7) return `${days} ${days === 1 ? "day" : "days"} ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function untilExpiry(iso) {
  const left = new Date(iso) - new Date();
  if (left <= 0) return "expired";
  const mins = Math.round(left / 60000);
  if (mins < 60) return `${mins} min left`;
  return `${Math.round(mins / 60)} hr left`;
}

// --- the dialog, reused ----------------------------------------------------
// A field is { name, label, type|options|value|placeholder }, or
// { name, label, copy: "<text>" } to show a copyable code box.
function ask({ title, fields = [], note = "", noteClass = "", confirm = "OK", cancel = "Cancel", danger = false }) {
  return new Promise((resolve) => {
    $("#dlg-title").textContent = title;
    $("#dlg-err").textContent = "";
    const body = $("#dlg-body");
    body.replaceChildren();
    for (const f of fields) {
      const wrap = el("div", { className: "field" });
      wrap.append(el("label", { htmlFor: "f-" + f.name, textContent: f.label }));
      if (f.copy !== undefined) {
        const box = el("div", { className: "copybox" });
        const code = el("code", { id: "f-" + f.name, textContent: f.copy });
        const btn = el("button", { type: "button", textContent: "Copy" });
        btn.onclick = () => navigator.clipboard.writeText(f.copy).then(() => {
          btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1500);
        }).catch(() => (btn.textContent = "Copy failed"));
        box.append(code, btn);
        wrap.append(box);
      } else if (f.checks) {
        const list = el("div", { className: "checks", id: "f-" + f.name });
        for (const o of f.checks) {
          const row = el("label", { className: "check" });
          row.append(el("input", { type: "checkbox", value: o.value, checked: !!o.checked }));
          row.append(el("span", { textContent: o.label }));
          list.append(row);
        }
        wrap.append(list);
      } else if (f.options) {
        const sel = el("select", { id: "f-" + f.name, name: f.name });
        for (const o of f.options) sel.append(el("option", { value: o.value, textContent: o.label }));
        wrap.append(sel);
      } else {
        wrap.append(el("input", {
          id: "f-" + f.name, name: f.name, type: f.type || "text",
          value: f.value || "", placeholder: f.placeholder || "",
        }));
      }
      body.append(wrap);
    }
    if (note) body.append(el("p", { className: "note " + noteClass, textContent: note }));

    const ok = $("#dlg-ok");
    ok.textContent = confirm;
    ok.className = danger ? "danger" : "fill";
    const cancelBtn = $("#dlg-cancel");
    cancelBtn.textContent = cancel;
    cancelBtn.style.display = cancel ? "" : "none";

    const close = (value) => { ok.onclick = null; cancelBtn.onclick = null; $("#dlg").close(); resolve(value); };
    ok.onclick = () => {
      const out = {};
      for (const f of fields) {
        const node = $("#f-" + f.name);
        if (!node) continue;
        if (f.checks) {
          out[f.name] = [...node.querySelectorAll("input:checked")].map((c) => c.value);
        } else if ("value" in node) {
          out[f.name] = node.value;
        }
      }
      close(out);
    };
    cancelBtn.onclick = () => close(null);
    $("#dlg").showModal();
  });
}

// --- state + rendering -----------------------------------------------------
let state = { accounts: [], people: [], activity: [] };
let panelURL = location.origin;

function table(headers, rows) {
  const t = el("table");
  const tr = el("tr");
  for (const h of headers) tr.append(el("th", { textContent: h.label || "", className: h.right ? "right" : "" }));
  t.append(el("thead", {}, tr));
  const tb = el("tbody");
  for (const r of rows) tb.append(r);
  t.append(tb);
  return t;
}
function cell(main, under, cls = "") {
  const td = el("td", { className: cls });
  td.append(el("div", { className: "name", textContent: main }));
  if (under) td.append(el("div", { className: "under", textContent: under }));
  return td;
}

function renderAccounts() {
  const body = $("#accounts-body");
  body.replaceChildren();
  const ready = state.accounts.filter((a) => a.hasLogin).length;
  const need = state.accounts.length - ready;
  $("#accounts-sub").textContent = state.accounts.length
    ? `${ready} ready to share` + (need ? `, ${need} need a login` : "")
    : "";

  if (!state.accounts.length) {
    body.append(el("div", { className: "empty" }, [
      el("div", { style: "font-size:16px; color:var(--ink); margin-bottom:8px", textContent: "No accounts yet." }),
      "On a machine where a Claude account is signed in, open the ccam page there and choose "
        + "“Add to panel” on that account. It shows up here, ready to share.",
    ]));
    return;
  }

  const rows = state.accounts.map((a) => {
    const tr = el("tr");
    tr.append(cell(a.name, a.email || (a.plan ? a.plan + " plan" : "")));

    const st = el("td");
    if (!a.hasLogin) {
      st.append(el("span", { className: "pill need", textContent: "Needs a login" }));
    } else if ((a.shared || []).length) {
      const tags = el("div", { className: "people-tags" });
      for (const sh of a.shared) {
        const tag = el("span", { className: "tag" }, [sh.personName]);
        tag.append(el("button", { type: "button", title: "Take access away", textContent: "×",
          onclick: () => revokeShare(a, sh) }));
        tags.append(tag);
      }
      st.append(tags);
    } else {
      st.append(el("span", { className: "pill ready", textContent: "Ready to share" }));
    }
    tr.append(st);

    const act = el("td", { className: "right" });
    if (!a.hasLogin) {
      act.append(el("button", { className: "link", textContent: "How to add its login", onclick: () => howToAddLogin(a) }));
    } else {
      act.append(el("button", { className: "link", textContent: "Give access", onclick: () => giveAccess(a) }));
    }
    act.append(el("button", { className: "link plain", textContent: "Remove", style: "margin-left:18px", onclick: () => removeAccount(a) }));
    tr.append(act);
    return tr;
  });
  body.append(table([{ label: "Account" }, { label: "Who can use it" }, { right: true }], rows));
}

// giveAccess shares an account with a person through the gateway. Many people
// can use one account at once, and access ends the instant it is taken back.
async function giveAccess(a) {
  const without = state.people.filter((p) => !(a.shared || []).some((s) => s.personId === p.id));
  if (!state.people.length) {
    await ask({ title: "Nobody to give it to", note: "Invite someone on the People tab first.", confirm: "Close", cancel: "" });
    return;
  }
  if (!without.length) {
    await ask({ title: "Everyone already has it", note: "Everyone you've added can already use this account.", confirm: "Close", cancel: "" });
    return;
  }
  const out = await ask({
    title: `Give access to ${a.name}`,
    fields: [{ name: "people", label: "To", checks: without.map((p) => ({ value: p.id, label: p.name })) }],
    note: "Pick everyone who should use this account. Many people can share it at once, through the gateway — it appears on each machine once they've joined.",
    confirm: "Give access",
  });
  if (!out) return;
  const ids = out.people || [];
  if (!ids.length) return;
  try {
    let lastGateway = "";
    for (const id of ids) {
      const { gateway } = await api("POST", `/api/accounts/${a.id}/share`, { personId: id });
      lastGateway = gateway || lastGateway;
    }
    await refresh();
    if (!lastGateway) {
      await ask({ title: "Gateway not set", note: "There's no gateway configured (CCAM_GATEWAY_URL), so there's nowhere to point their access yet.", confirm: "Close", cancel: "" });
      return;
    }
    const names = without.filter((p) => ids.includes(p.id)).map((p) => p.name).join(", ");
    await ask({
      title: "Done",
      note: `${names} can now use ${a.name}. It appears on each machine within a minute once they've joined — invite anyone who hasn't from the People tab.`,
      confirm: "Close", cancel: "",
    });
  } catch (e) { alert(e.message); }
}

async function revokeShare(a, sh) {
  const out = await ask({
    title: `Take ${a.name} away from ${sh.personName}?`,
    note: "Their access stops within seconds, and any session they're running on it ends.",
    confirm: "Take it away", danger: true,
  });
  if (out) await run(() => api("POST", `/api/shares/${sh.shareId}/revoke`));
}

// howToAddLogin explains the one thing the panel can't do itself: sign in.
function howToAddLogin(a) {
  ask({
    title: `Add a login for ${a.name}`,
    note: "The panel can't sign in for you — Claude's login needs a real browser. On the machine where this account is signed in, open the ccam page there and choose “Add to panel” on it. That hands its login up here. People you share it with never do this.",
    confirm: "Got it", cancel: "",
  });
}

function renderPeople() {
  const body = $("#people-body");
  body.replaceChildren();
  const setUp = state.people.filter((p) => (p.devices || []).length).length;
  $("#people-sub").textContent = state.people.length
    ? `${state.people.length} ${state.people.length === 1 ? "person" : "people"}, ${setUp} set up`
    : "";
  if (!state.people.length) {
    body.append(el("div", { className: "empty", textContent: "Nobody yet. Invite someone — they get a link, join in a click, and whatever you share appears on their machine." }));
    return;
  }
  const rows = state.people.map((p) => {
    const tr = el("tr");
    tr.append(cell(p.name, p.email));
    tr.append(el("td", {}, el("span", {
      className: (p.can || []).length ? "" : "free",
      textContent: (p.can || []).join(", ") || "Nothing yet",
    })));
    const machines = el("td");
    const devices = p.devices || [];
    if (!devices.length) {
      machines.append(el("span", { className: "free", textContent: "Not joined yet" }));
    } else {
      for (const d of devices) {
        const row = el("div", { style: "display:flex; gap:10px; align-items:baseline" });
        row.append(el("span", { className: "mono", style: "font-size:13.5px", textContent: d.name }));
        row.append(el("span", { className: "under", textContent: d.lastSeen ? when(d.lastSeen) : "" }));
        row.append(el("button", { className: "link warn", style: "margin-left:auto; font-size:13px",
          textContent: "Remove", onclick: () => cutOff(p, d) }));
        machines.append(row);
      }
    }
    tr.append(machines);
    const act = el("td", { className: "right" });
    act.append(el("button", { className: "link", textContent: "Invite", onclick: () => invitePerson(p) }));
    act.append(el("button", { className: "link plain", textContent: "Remove", style: "margin-left:18px", onclick: () => removePerson(p) }));
    tr.append(act);
    return tr;
  });
  body.append(table([{ label: "Person" }, { label: "Can use" }, { label: "Machines" }, { right: true }], rows));
}

function renderActivity() {
  const body = $("#activity-body");
  body.replaceChildren();
  if (!state.activity.length) {
    body.append(el("div", { className: "empty", textContent: "Nothing has happened yet." }));
    return;
  }
  const list = el("div", { style: "margin-top:22px" });
  for (const e of state.activity) {
    const row = el("div", { className: "ev" });
    row.append(el("time", { dateTime: e.at, textContent: when(e.at) }));
    row.append(el("span", { textContent: `${e.who} ${e.what}.` }));
    list.append(row);
  }
  body.append(list);
}

async function refresh() {
  state = await api("GET", "/api/panel");
  state.accounts ||= []; state.people ||= []; state.activity ||= [];
  renderAccounts(); renderPeople(); renderActivity();
}

// --- decisions -------------------------------------------------------------
async function removeAccount(a) {
  const out = await ask({
    title: `Remove ${a.name}?`,
    note: (a.shared || []).length ? "Everyone using it loses access." : "",
    confirm: "Remove", danger: true,
  });
  if (out) await run(() => api("DELETE", `/api/accounts/${a.id}`));
}

async function removePerson(p) {
  const out = await ask({
    title: `Remove ${p.name}?`,
    note: "Their access ends and their machines stop working straight away.",
    confirm: "Remove", danger: true,
  });
  if (out) await run(() => api("DELETE", `/api/people/${p.id}`));
}

async function cutOff(p, d) {
  const out = await ask({
    title: `Remove ${d.name}?`,
    note: `${p.name}'s other machines keep working.`,
    confirm: "Remove", danger: true,
  });
  if (out) await run(() => api("DELETE", `/api/devices/${d.id}`));
}

// invitePerson makes a fresh invite link for someone already added.
async function invitePerson(p) {
  try {
    const { url, expiresAt } = await api("POST", `/api/people/${p.id}/invite`);
    await showInvite(p.name, url, expiresAt);
    await refresh();
  } catch (e) { alert(e.message); }
}

// showInvite presents an invite link with a copy button and its expiry.
async function showInvite(name, url, expiresAt) {
  await ask({
    title: `Invite for ${name}`,
    fields: [{ name: "link", label: "Send them this link", copy: url }],
    note: `Works once, ${untilExpiry(expiresAt)}. They open it, join in a click, and whatever you share shows up on their machine.`,
    confirm: "Done", cancel: "",
  });
}

// inviteSomeone adds a person and hands you their invite link in one step.
async function inviteSomeone() {
  const out = await ask({
    title: "Invite someone",
    fields: [
      { name: "name", label: "Their name", placeholder: "Ehtisham" },
      { name: "email", label: "Email (optional)" },
    ],
    confirm: "Create invite",
  });
  if (!out || !out.name) return;
  try {
    await api("POST", "/api/people", { name: out.name, email: out.email });
    await refresh();
    const target = state.people.find((p) => p.name === out.name);
    if (!target) return;
    const { url, expiresAt } = await api("POST", `/api/people/${target.id}/invite`);
    await showInvite(out.name, url, expiresAt);
    await refresh();
  } catch (e) { alert(e.message); }
}

async function addAccount() {
  const out = await ask({
    title: "Add an account",
    fields: [
      { name: "name", label: "Name", placeholder: "Work" },
      { name: "email", label: "Its Claude sign-in (optional)", placeholder: "work@example.com" },
    ],
    note: "This makes an empty slot. To share it, add its login from the machine where it's signed in — see “How to add its login”.",
    confirm: "Add",
  });
  if (out?.name) await run(() => api("POST", "/api/accounts", out));
}

// run does a thing, reloads, and puts any refusal in front of the person.
async function run(fn) {
  try { await fn(); await refresh(); }
  catch (e) { alert(e.message); }
}

// --- getting in ------------------------------------------------------------
async function boot() {
  const st = await api("GET", "/api/status");
  panelURL = st.canonicalUrl || location.origin;
  if (st.signedIn) { show("panel"); await refresh(); return; }
  show("gate");
  if (st.needsSetup) {
    $("#gate-title").textContent = "Set a password";
    $("#gate-blurb").textContent = "It's the only thing between a stranger and every account you share, so make it a long one.";
    $("#pw").autocomplete = "new-password";
    $("#gate-go").textContent = "Set up";
    $("#gate-form").dataset.mode = "setup";
  }
}
function show(which) {
  $("#gate").classList.toggle("hidden", which !== "gate");
  $("#panel").classList.toggle("hidden", which !== "panel");
}

$("#gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const setup = e.target.dataset.mode === "setup";
  try {
    await api("POST", setup ? "/api/setup" : "/api/login", { password: $("#pw").value });
    show("panel");
    await refresh();
  } catch (err) { $("#gate-err").textContent = err.message; }
});

$("#signout").addEventListener("click", async () => {
  await api("POST", "/api/logout");
  location.reload();
});

for (const b of document.querySelectorAll("nav button")) {
  b.addEventListener("click", () => {
    for (const other of document.querySelectorAll("nav button")) other.setAttribute("aria-current", String(other === b));
    for (const name of ["accounts", "people", "activity"]) {
      $("#tab-" + name).classList.toggle("hidden", name !== b.dataset.tab);
    }
  });
}
$("#add-account").addEventListener("click", addAccount);
$("#invite-someone").addEventListener("click", inviteSomeone);

boot().catch((e) => { $("#gate-err").textContent = e.message; show("gate"); });
</script>
</body>
</html>

# ccam gateway — reverse proxy with TLS (certbot manages the 443 block).
# Streaming (SSE) must not be buffered, and Claude responses can be long-lived.
server {
    listen 80;
    server_name ccam-gw.207.180.203.98.sslip.io;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

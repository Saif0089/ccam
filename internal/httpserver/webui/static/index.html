<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccam — Claude Code Account Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ccam</h1>
  <p class="subtitle">Claude Code Account Manager</p>
</header>

<main>
  <section class="toolbar">
    <button id="add-account-btn" class="primary">Add account</button>
    <span class="spacer"></span>
    <span id="refreshed" aria-live="polite"></span>
    <button id="refresh-btn" type="button">Refresh usage</button>
  </section>

  <section id="accounts-list"></section>
  <p id="empty-state" hidden>No accounts yet. Click "Add account" to link your first Claude Code login.</p>
</main>

<dialog id="add-dialog">
  <form id="add-form">
    <h2>Add account</h2>
    <label>
      Name
      <input id="add-name" type="text" placeholder="e.g. Work, Personal" required pattern=".*\S.*" autofocus>
    </label>
    <div class="dialog-actions">
      <button type="button" id="add-cancel">Cancel</button>
      <button type="submit" class="primary">Create &amp; connect</button>
    </div>
  </form>
</dialog>

<dialog id="login-dialog">
  <h2>Connect account</h2>
  <p id="login-status" aria-live="polite">Starting login…</p>

  <div id="login-url-box" hidden>
    <a id="login-url" href="#" target="_blank" rel="noopener"></a>
    <button type="button" id="login-copy">Copy URL</button>
  </div>

  <form id="login-code-form" hidden>
    <label>
      If the page gives you a code to paste, put it here:
      <input id="login-code" type="text" placeholder="Paste authorization code" autocomplete="off">
    </label>
    <div class="dialog-actions">
      <button type="submit" class="primary">Submit code</button>
    </div>
  </form>

  <div class="dialog-actions">
    <button type="button" id="login-close">Close</button>
  </div>
</dialog>

<dialog id="rename-dialog">
  <form id="rename-form">
    <h2>Rename account</h2>
    <input type="hidden" id="rename-id">
    <label>
      Name
      <input id="rename-name" type="text" required pattern=".*\S.*">
    </label>
    <div class="dialog-actions">
      <button type="button" id="rename-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<template id="account-row-template">
  <article class="account-card">
    <div class="account-main">
      <span class="account-name"></span>
      <span class="status-badge"></span>
      <span class="plan-chip"></span>
    </div>
    <div class="account-alias">
      <code class="alias-text"></code>
      <button class="copy-alias" type="button">Copy</button>
    </div>
    <div class="meters"></div>
    <p class="usage-note" hidden></p>
    <div class="session"></div>
    <div class="account-actions">
      <button class="launch-terminal" type="button">Open terminal</button>
      <button class="connect-btn" type="button">Connect</button>
      <button class="rename-btn" type="button">Rename</button>
      <button class="remove-btn danger" type="button">Remove</button>
    </div>
  </article>
</template>

<template id="meter-template">
  <div class="meter">
    <div class="meter-head">
      <span class="meter-label"></span>
      <span class="meter-pct"></span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="bar-fill"></div>
    </div>
    <div class="meter-reset"></div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>

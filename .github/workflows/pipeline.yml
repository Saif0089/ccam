name: Pipeline

# One pipeline, two ways to trigger a release:
#   - push to main:  test -> e2e -> build -> publish updates the rolling
#     "latest" GitHub Release. This is the "just push to main" path —
#     no version bump needed for day-to-day changes.
#   - push a `vX.Y.Z` tag: same test -> e2e -> build, but publish
#     creates a proper pinned, versioned release instead.
# A pull_request only runs test + e2e (no build/publish), as a
# pre-merge regression gate.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # GitHub-hosted runners execute as an ordinary, non-elevated
    # per-user account with no way to answer a sudo/UAC prompt — a
    # timeout here (rather than a clean failure) is exactly what
    # "silently required admin" looks like.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Best-effort CI-only accommodation, not a product requirement:
      # Windows Defender's on-access scan of a freshly built/executed
      # exe can hold a brief lock right after it exits, which the
      # self-delete-on-uninstall test has to wait out. Excluding the Go
      # build/temp dirs removes that variance; if this can't (no rights
      # in this runner config), it just no-ops.
      - name: Exclude temp/work dirs from Defender scanning (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
            Add-MpPreference -ExclusionPath $env:TEMP
            Write-Host "Added Defender exclusions."
          } catch {
            Write-Host "Could not add Defender exclusions (continuing anyway): $_"
          }

      - name: Run end-to-end lifecycle test
        run: go test ./test/e2e/... -v -timeout 8m

  # The Go tests drive the HTTP API directly and never load the page, so
  # a UI that was completely broken in a real browser once passed CI
  # while failing on every real machine. This job loads it for real, in
  # Chromium and in WebKit (Safari's engine).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: test/browser
        run: |
          npm install
          npx playwright install --with-deps chromium webkit

      - name: Run browser end-to-end tests
        working-directory: test/browser
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/browser/test-results/
          retention-days: 7

  # A real Linux user's install, in a container: an ordinary non-root
  # user, no systemd user bus (so the XDG autostart fallback is what
  # gets written), and the service then started from that entry's own
  # command line with the bare PATH a login-started process actually
  # gets. The hosted runner exercises none of that — it has the full
  # runner PATH and starts ccam directly.
  linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install, log in and uninstall as a plain Linux user
        run: |
          docker run --rm -v "$PWD":/src -w /src golang:1.26-bookworm bash -c '
            useradd -m -u 1000 tester
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq curl python3 >/dev/null 2>&1
            mkdir -p /home/tester/.config/fish
            chown -R tester /home/tester
            chmod 777 /tmp
            su tester -c "GOCACHE=/tmp/gocache GOPATH=/tmp/gopath GOFLAGS=-mod=mod bash /src/test/linux/run.sh"
          '

  # The real published install.sh, against the real published release,
  # in a clean container: architecture detection, the download, the
  # checksums CI publishes beside it, and a per-user install with no
  # root. Nothing else covers the first thing a Linux user does.
  #
  # Skipped on pull requests, where there is no published build for the
  # branch to install.
  linux-installer:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install from the published release
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:bookworm-slim bash -c '
            useradd -m -u 4242 tester
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq curl python3 ca-certificates >/dev/null 2>&1
            chown -R tester /home/tester
            su tester -c "bash /src/test/linux/install-script.sh"
          '

  # The Windows counterpart of linux-install/linux-installer. Two things
  # nothing else covers: that install.ps1 actually parses (a syntax error
  # in a script piped into `iex` is only ever discovered by a user), and
  # that a default install raises NO elevation prompt.
  #
  # The prompt check is the timeout. A GitHub runner is a non-elevated
  # account with no way to answer UAC, so a script that asked for it
  # would hang here rather than fail — which is precisely the signal we
  # want, and why this job's timeout is deliberately short.
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "install.ps1 and every shipped .ps1 parses"
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch 'node_modules' }) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "PARSE ERRORS in $($f.Name):"
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
              $bad = 1
            } else {
              Write-Host "OK $($f.Name)"
            }
          }
          if ($bad) { throw "PowerShell parse errors" }

      - name: "Elevation is requested only when Windows refuses"
        shell: pwsh
        run: |
          # Exercise the helpers directly rather than the whole install,
          # so this runs on pull requests too (where no release exists).
          # Dot-sourcing would run the installer, so pull the functions
          # out of the parsed AST instead.
          $src = Get-Content install.ps1 -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$null, [ref]$null)
          $fns = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          $names = $fns | ForEach-Object { $_.Name }
          foreach ($want in @('Invoke-Elevated', 'Test-AccessDenied', 'ps1Quote')) {
            if ($names -notcontains $want) { throw "install.ps1 lost $want" }
          }
          ($fns | Where-Object { $_.Name -in @('Test-AccessDenied','ps1Quote') } |
            ForEach-Object { $_.Extent.Text }) -join "`n" | Invoke-Expression

          # A permission error must elevate; nothing else may, or a user
          # gets a UAC prompt for a full disk.
          $denied = New-Object System.Management.Automation.ErrorRecord(
            (New-Object System.UnauthorizedAccessException "denied"), 'x',
            [System.Management.Automation.ErrorCategory]::PermissionDenied, $null)
          if (-not (Test-AccessDenied $denied)) { throw "UnauthorizedAccessException must count as access denied" }
          $other = New-Object System.Management.Automation.ErrorRecord(
            (New-Object System.IO.IOException "disk full"), 'x',
            [System.Management.Automation.ErrorCategory]::WriteError, $null)
          if (Test-AccessDenied $other) { throw "a disk-full error must NOT trigger an elevation prompt" }

          if ((ps1Quote "C:\Users\O'Brien\ccam.exe") -ne "'C:\Users\O''Brien\ccam.exe'") { throw "ps1Quote escaping wrong" }
          Write-Host "elevation trigger + quoting: OK"

      - name: "Default install completes with no elevation prompt"
        if: github.event_name == 'push'
        shell: pwsh
        timeout-minutes: 5
        run: |
          # The real published install.ps1 flow. If it ever asks for
          # administrator rights on a default per-user install, there is
          # nobody here to answer and this step times out.
          ./install.ps1
          $dest = Join-Path $env:LOCALAPPDATA "ccam\bin\ccam.exe"
          if (-not (Test-Path $dest)) { throw "ccam.exe not installed at $dest" }
          & $dest version
          & $dest uninstall
          Write-Host "per-user install with no elevation: OK"

  build:
    needs: [test, e2e, browser, linux-install]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          name="ccam_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X ccam/internal/buildinfo.Version=${{ github.ref_name }} -X ccam/internal/buildinfo.Commit=${{ github.sha }}" \
            -o "dist/${name}" ./cmd/ccam
          echo "ASSET_NAME=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the build binaries — never the browser job's playwright-report
          # (a directory tree uploaded on a flaky failure), which would otherwise
          # land in dist and break the checksum and the release upload.
          pattern: ccam_*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" dist/* \
              --title "${{ github.ref_name }}" \
              --generate-notes
          else
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/* \
              --title "latest (main@$(git rev-parse --short HEAD))" \
              --notes "Continuously published from main — install.sh/install.ps1 default to this. For a pinned version, use a vX.Y.Z release instead." \
              --latest
          fi

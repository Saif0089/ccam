name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # GitHub-hosted runners execute as an ordinary, non-elevated
    # per-user account with no way to answer a sudo/UAC prompt — a
    # timeout here (rather than a clean failure) is exactly what
    # "silently required admin" looks like.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run end-to-end lifecycle test
        run: go test ./test/e2e/... -v -timeout 8m
